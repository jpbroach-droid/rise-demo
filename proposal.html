<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Rise Proposal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/ui.css">
<style>
body{background:#ECEEF2}
.doc{max-width:760px;margin:24px auto 60px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.doc .head{padding:22px max(24px,env(safe-area-inset-right,0px)) 18px max(24px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--brand);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.doc .head img{height:44px}
.body{padding:22px max(24px,env(safe-area-inset-right,0px)) 26px max(24px,env(safe-area-inset-left,0px))}
.opt{border:2px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.sigpad{border:1px dashed var(--line-2);border-radius:8px;height:110px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;cursor:crosshair;position:relative;background:#fff}
.sigpad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sigpad span{pointer-events:none;position:relative}
.tc{font-size:12.5px;color:var(--ink-2);max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg)}
.done{background:var(--ok-soft);border:1px solid #BFE3D0;border-radius:8px;padding:16px;text-align:center}
.sticky{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style></head><body>
<div class="doc" id="doc"></div>
<div class="testmode">Test mode · demo data</div>
<div class="toast" id="toast"></div>
<script src="assets/data.js"></script>
<script>
(function(){
var db=RISE.db,$=function(s){return document.querySelector(s)},money=RISE.money,fd=RISE.fmtDate;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function toast(m){var x=$('#toast');x.textContent=m;x.classList.add('show');clearTimeout(x._x);x._x=setTimeout(function(){x.classList.remove('show')},2600)}
var pid=(location.search.match(/id=(P-\d+)/)||[])[1]||'P-7709';var p=RISE.find('proposals',pid)||db.proposals[0];var sel=p.options?p.options.length-1:null;var signed=p.status==='Signed';var drawn=false;
if(!signed&&p.tracking&&!p._opened){p._opened=true;p.tracking.push({t:RISE.nowStamp(),e:'Opened by '+RISE.cust(p.customer).contact+' (link)'});if(p.status==='Sent')p.status='Viewed';RISE.save()}
function lines(){if(p.type==='Maintenance')return [['Full-service maintenance — 3 cars, monthly visits',p.amount,'/mo'],['Callbacks during regular hours',0,''],['Annual Cat 1 testing with AHJ',0,''],['Emergency phone monitoring',45,'/mo']];
  if(p.type==='Modernization')return [['Mobilization & permits',Math.round(amt()*.06),''],['Equipment per selected option',Math.round(amt()*.64),''],['Installation labor (IUEC)',Math.round(amt()*.26),''],['Testing & AHJ acceptance',Math.round(amt()*.04),'']];
  return [['Materials',Math.round(p.amount*.58),''],['Labor — union mechanics',Math.round(p.amount*.38),''],['Permit / inspection fee',Math.round(p.amount*.04),'']]}
function amt(){return p.options?p.options[sel].amt:p.amount}
function render(){var c=RISE.cust(p.customer),b=RISE.bldg(p.building),tc=db.tcTemplates.filter(function(t){return t.id===p.tc})[0];var h='<div class="head"><div><img src="assets/rise-logo.png" alt="Rise Elevator"><div class="xs faint" style="margin-top:6px">Rise Elevator Services · Richmond, VA · (804) 624-7327</div></div><div style="text-align:right"><div class="eyebrow">Proposal</div><div class="num" style="font-size:18px">'+p.id+'</div><div class="xs faint">'+fd(p.sent||RISE.today,{month:'long',day:'numeric',year:'numeric'})+' · valid 30 days</div></div></div><div class="body">';
  h+='<h1 style="margin-bottom:6px">'+esc(p.title)+'</h1><p class="muted" style="margin-bottom:18px">Prepared for '+esc(c.contact)+', '+esc(c.name)+' · '+esc(b.name)+', '+esc(b.address)+', '+esc(b.city)+'</p>';
  if(p.source&&p.source.indexOf('FixFlow')===0)h+='<div class="stripe warn" style="padding:6px 12px;margin-bottom:14px;background:var(--warn-soft)"><b>Why you\'re seeing this:</b> '+esc(p.source.replace('FixFlow — ',''))+' noted a deficiency with a correction deadline. This proposal clears it and books the re-inspection.</div>';
  if(p.options){h+='<h3 style="margin-bottom:8px">Choose a scope</h3><div class="stack" style="margin-bottom:18px">'+p.options.map(function(o,i){return '<div class="opt'+(i===sel?' on':'')+'" onclick="pick('+i+')"><div class="row between"><b>'+esc(o.name)+'</b><span class="num">'+money(o.amt)+'</span></div><div class="xs muted">'+(i===0?'Addresses the controller faults and valve wear flagged in your last three callbacks.':i===1?'Adds new door equipment — the source of most of your passenger complaints.':'Everything, plus ADA-compliant fixtures and a 24-month parts & labor warranty.')+'</div></div>'}).join('')+'</div>'}
  h+='<div class="tbl"><table><tr><th>Scope</th><th class="num">Amount</th></tr>'+lines().map(function(l){return '<tr><td>'+esc(l[0])+'</td><td class="num">'+(l[1]?money(l[1])+l[2]:'Included')+'</td></tr>'}).join('')+'<tr><td><b>Total</b></td><td class="num"><b>'+money(amt())+(p.monthly?'/mo':'')+'</b></td></tr></table></div>';
  if(p.type==='Modernization')h+='<p class="small muted" style="margin-top:10px">Billing: progress payments monthly against the schedule of values (AIA G702/G703), 10% retainage released at AHJ acceptance. Escalation clause applies if the start date moves more than 90 days at the owner\'s request.</p>';
  else if(p.type==='Maintenance')h+='<p class="small muted" style="margin-top:10px">Billing: monthly in advance, autopay available. 36-month term, 3% annual adjustment, 60 days\' notice to cancel after the initial term.</p>';
  else h+='<p class="small muted" style="margin-top:10px">Billing: '+(amt()>5000?'50% deposit at signing, balance on completion':'invoiced on completion, net 30')+'. 90-day warranty on parts and labor.</p>';
  h+='<h3 style="margin:18px 0 6px">Terms &amp; conditions <span class="faint small">'+p.tc+'</span></h3><div class="tc">'+(tc?tc.clauses.map(function(cl,i){return '<p style="margin-bottom:6px"><b>'+(i+1)+'. '+esc(cl)+'.</b> '+({'Term & auto-renewal':'The agreement renews for successive terms unless either party gives 60 days\' written notice.','Annual price adjustment':'Monthly fees adjust each anniversary by the stated percentage or CPI-U, whichever is greater.','Progress billing (AIA G702/G703)':'Contractor submits monthly pay applications; owner pays within 30 days of receipt.','Retainage':'Owner may retain the stated percentage until final acceptance by the authority having jurisdiction.','Delay & escalation clause':'If owner-caused delays exceed 90 days, material pricing is re-quoted at then-current cost.','Pricing valid 30 days':'Prices are firm for 30 days from the proposal date.'}[cl]||'Standard Rise Elevator Services terms apply as published in this version.')+'</p>'}).join(''):'')+'</div>';
  if(signed){h+='<div class="done" style="margin-top:18px"><div style="font-size:28px">✓</div><b>Signed'+(p.signed?' '+fd(p.signed,{month:'long',day:'numeric',year:'numeric'}):'')+'</b><div class="small muted">A countersigned PDF has been emailed. '+(p.type==='Maintenance'?'Your first visit will be scheduled within 10 days.':'Our office will confirm the schedule within 2 business days.')+'</div></div>'}
  else{h+='<h3 style="margin:18px 0 8px">Accept &amp; sign</h3><div class="grid g2"><div class="field"><label>Your name</label><input id="s-name" value="'+esc(c.contact)+'"></div><div class="field"><label>Title</label><input id="s-title" value="Property Manager"></div></div><div class="field" style="margin-top:10px"><label>Signature — draw with your mouse or finger</label><div class="sigpad" id="pad"><canvas id="cv"></canvas><span id="padhint">Sign here</span></div></div>';
    h+='<h3 style="margin:16px 0 8px">Billing details</h3><div class="grid g2"><div class="field"><label>Billing contact email</label><input value="'+esc(c.email)+'"></div><div class="field"><label>PO number (optional)</label><input placeholder="Your PO #"></div></div><div class="grid g2" style="margin-top:10px"><div class="field"><label>Payment method</label><select id="s-pay"><option>Card on file (secure, via Stax)</option><option>ACH bank transfer</option><option>Invoice me — net 30</option></select></div><div class="field"><label>Card number</label><input value="4242 4242 4242 4242" class="num"></div></div><label class="row small" style="margin-top:10px"><input type="checkbox" id="s-agree" style="width:auto"> I accept the terms above on behalf of '+esc(c.name)+'.</label>'}
  h+='</div>';
  if(!signed)h+='<div class="sticky"><div><div class="xs eyebrow">Total</div><div class="num" style="font-size:18px">'+money(amt())+(p.monthly?'/mo':'')+(p.type!=='Maintenance'&&amt()>5000&&p.type!=='Modernization'?' <span class="small muted">· '+money(amt()/2)+' due at signing</span>':'')+'</div></div><div class="row"><button class="btn" onclick="toast(\'Question sent to '+esc(RISE.user(p.owner).name)+' — they\\\'ll reply by email\')">Ask a question</button><button class="btn primary" onclick="sign()">Sign &amp; accept</button></div></div>';
  $('#doc').innerHTML=h; if(!signed)pad();
}
window.pick=function(i){sel=i;p.tracking.push({t:RISE.nowStamp(),e:'Compared options — viewing '+p.options[i].name});RISE.save();render()};
function pad(){var cv=$('#cv'),el=$('#pad');if(!cv)return;cv.width=el.clientWidth;cv.height=el.clientHeight;var ctx=cv.getContext('2d');ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#16181D';var down=false;function pos(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
  function st(e){down=true;drawn=true;$('#padhint').hidden=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);e.preventDefault()}function mv(e){if(!down)return;var p=pos(e);ctx.lineTo(p[0],p[1]);ctx.stroke();e.preventDefault()}function en(){down=false}
  cv.addEventListener('pointerdown',st);cv.addEventListener('pointermove',mv);window.addEventListener('pointerup',en)}
window.sign=function(){if(!$('#s-agree').checked){toast('Please tick the acceptance box');return}if(!drawn){toast('Please sign in the box');return}signed=true;p.status='Signed';p.signed=RISE.today;if(p.options){p.amount=p.options[sel].amt;p.selected=p.options[sel].name}p.tracking.push({t:RISE.nowStamp(),e:'Signed by '+$('#s-name').value+' · '+$('#s-pay').value.split(' (')[0]+' captured'});var lead=db.leads.filter(function(l){return l.company===RISE.bldg(p.building).name||l.value===p.amount})[0];if(lead){lead.stage='Won';lead.next='Schedule work'}
  if(p.type==='Maintenance'){db.contracts.push({id:RISE.nextId('MA-','contracts'),customer:p.customer,territory:p.territory,type:'Full Service',units:db.units.filter(function(u){return u.customer===p.customer}).map(function(u){return u.id}),monthly:p.amount,perUnit:Math.round(p.amount/3),billing:'Monthly',start:RISE.today,end:RISE.addDays(RISE.today,1095),termMonths:36,autoRenew:true,cancelClause:'None',escalation:{pct:3,every:'Annual',next:RISE.addDays(RISE.today,365),indexed:'Fixed'},tcVersion:p.tc})}
  else{db.jobs.push({id:RISE.nextId('J-','jobs'),name:p.title+' — '+RISE.bldg(p.building).name,customer:p.customer,building:p.building,territory:p.territory,type:p.type,contract:p.amount,billedPct:0,retainage:p.type==='Modernization'?10:0,status:'Scheduling',pm:'Tom Reilly',start:RISE.addDays(RISE.today,14),end:RISE.addDays(RISE.today,p.type==='Modernization'?180:21),proposal:p.id,budget:p.estimate?{labor:p.estimate.labor,material:p.estimate.material,subs:p.estimate.subs,misc:p.estimate.misc}:{labor:Math.round(p.cost*.4),material:Math.round(p.cost*.55),subs:0,misc:Math.round(p.cost*.05)},actual:{labor:0,material:0,subs:0,misc:0},crew:[],changeOrders:[]})}
  RISE.log($('#s-name').value,'Proposal link','Signed '+p.id+' · '+money(p.amount)+' · '+(p.type==='Maintenance'?'agreement created, first visit scheduling':'job created, deposit invoiced'));RISE.save();render();window.scrollTo(0,0)};
render();
})();
</script></body></html>
