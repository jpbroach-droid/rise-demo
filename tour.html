.dbar .count{font-family:var(--mono);font-size:13px;color:var(--ink-3);white-space:nowrap}
.dbar .count b{color:var(--brand-ink);font-size:20px;font-weight:500}
.dbar .txt{flex:1;min-width:0}
.dbar .ttl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink);font-weight:600}
.dbar .cap{font-size:19px;font-weight:500;line-height:1.3;margin-top:2px;text-wrap:balance}
.dbar .sub{font-size:13.5px;color:var(--ink-2);margin-top:3px}

.notes ul{margin:0;padding-left:18px}

.menu button:hover{background:var(--bg)}
.menu button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.menu button span{font-family:var(--mono);color:var(--ink-3);width:22px;flex:none}

/* ---------- engine ---------- */
document.getElementById('tot').textContent=S.length;
function paint(i){var st=S[i];document.getElementById('n').textContent=i+1;document.getElementById('ttl').textContent=st.t;document.getElementById('cap').textContent=st.c;document.getElementById('sub').textContent=st.s||'';document.getElementById('pg').style.width=((i+1)/S.length*100)+'%';
  var nt=document.getElementById('notes');nt.innerHTML='<h4>Speaker notes · step '+(i+1)+'</h4>'+(st.n?'<ul>'+st.n.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':'<div style="color:#9AA1AE">Nothing extra here. Let it breathe.</div>');
  document.getElementById('nx').textContent=i===S.length-1?'Done':'Next ›';drawMenu();try{history.replaceState(null,'','#step-'+(i+1))}catch(e){}}
async function show(i,run){if(busy)return;busy=true;var nx=document.getElementById('nx');nx.disabled=true;clearHL();cur=i;paint(i);var st=S[i];
  try{phone(!!st.phone);var url=typeof st.left==='function'?st.left():st.left;var jobs=[load(L,url)];if(st.phone&&st.pUrl&&(!P.src||P.src.indexOf(st.pUrl)<0))jobs.push(load(P,st.pUrl));await Promise.all(jobs);
    if(run&&st.run&&!done[i]){done[i]=true;saveState();await st.run()}}catch(e){console.error(e)}
  saveState();busy=false;nx.disabled=false;if(queued){var qd=queued;queued=0;if(qd>0)next();else back()}}
var lastTap=0;function bounce(){var t=Date.now();if(t-lastTap<450)return true;lastTap=t;return false}
window.next=function(){if(bounce())return;if(busy){queued=1;return}if(cur<S.length-1)show(cur+1,true)};
window.back=function(){if(bounce())return;if(busy){queued=-1;return}if(cur>0)show(cur-1,false)};
window.go=function(i){document.getElementById('menu').hidden=true;show(i,true)};
window.toggleNotes=function(){var n=document.getElementById('notes');n.hidden=!n.hidden};
window.toggleMenu=function(){var m=document.getElementById('menu');m.hidden=!m.hidden};
function drawMenu(){document.getElementById('menu').innerHTML=S.map(function(st,i){return '<button class="'+(i===cur?'on':'')+'" onclick="go('+i+')"><span>'+(i+1)+'</span>'+st.t+' — '+st.c+'</button>'}).join('')+'<div style="border-top:1px solid var(--line);margin:6px 0;padding-top:6px"><button onclick="resetDemo()"><span>↺</span>Reset demo data and start over</button><button onclick="document.body.classList.add(\'hidebar\');toggleMenu()"><span>▢</span>Hide the demo bar (free explore)</button></div>'}
window.resetDemo=async function(){document.getElementById('menu').hidden=true;try{R().reset()}catch(e){}done={};T.callId=null;T.pid=null;try{sessionStorage.removeItem('rise-tour')}catch(e){}P.src='about:blank';L.src='about:blank';cur=-1;await sleep(100);show(0,true)};
function keys(e){var tag=(e.target&&e.target.tagName)||'';if(/INPUT|TEXTAREA|SELECT/.test(tag))return;if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();back()}else if(e.key==='n'||e.key==='N')toggleNotes();else if(e.key==='m'||e.key==='M')toggleMenu();else if(e.key==='h'||e.key==='H')document.body.classList.toggle('hidebar')}
document.addEventListener('keydown',keys);
fit();
var saved=null;try{saved=JSON.parse(sessionStorage.getItem('rise-tour')||'null')}catch(e){}
var start=(location.hash.match(/step-(\d+)/)||[])[1];
if(saved&&saved.cur>=0&&saved.cur<S.length){done=saved.done||{};if(saved.T)T=saved.T;show(saved.cur,false)}
else if(start&&+start>1){(async function(){await show(0,false);for(var i=1;i<+start;i++){await show(i,true)}})()}else show(0,true);
})();
