<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Rise Mechanic App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/ui.css">
<style>
/* Phone frame on desktop, full-bleed on a real phone. Big tap targets; works offline (queue shown). */
body{background:#E9EBEF;display:flex;justify-content:center;align-items:flex-start;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));min-height:100%}
.phone{width:390px;max-width:100%;background:var(--panel);border-radius:34px;border:8px solid #1b1d22;box-shadow:0 30px 60px rgba(0,0,0,.25);overflow:hidden;position:relative;height:800px;display:flex;flex-direction:column}
@media(max-width:480px){body{padding:0}.phone{border:0;border-radius:0;height:100vh;width:100%}}
.statusbar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;background:var(--panel)}
.hdr{padding:6px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.hdr img{height:26px}
.net{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.net.off{background:var(--warn-soft);color:var(--warn)}
.screen{flex:1;overflow:auto;padding:14px 16px 90px;background:var(--bg)}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;font-size:10.5px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.tabbar button.on{color:var(--brand)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:17px;padding:14px;border-radius:10px;width:100%;justify-content:center;font-weight:600}
.clockcard{background:var(--ink);color:#fff;border-radius:12px;padding:16px}
.clockcard .t{font-family:var(--mono);font-size:30px;letter-spacing:-.02em}
.jobcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.jobcard.ent{border-color:var(--bad);background:var(--bad-soft)}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.task input{width:22px;height:22px;margin:0;flex:none}
.task.done{opacity:.55;text-decoration:line-through}
.photo{aspect-ratio:4/3;border-radius:8px;background:linear-gradient(135deg,#d8dbe0,#b9bec6);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:12px}
.sheet{position:absolute;inset:0;background:var(--panel);z-index:5;display:flex;flex-direction:column}
.sheet .screen{padding-bottom:20px}
.q{border:1px dashed var(--line-2);border-radius:8px;padding:10px;font-size:12px;color:var(--ink-3)}
.pv{display:flex;flex-direction:column;gap:6px}
.offline-note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12px}
.hide{display:none!important}
.task .ttl{flex:1}.task .more{color:var(--info);font-size:12px;font-weight:500;white-space:nowrap}
.seg{display:flex;background:var(--line);border-radius:8px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:6px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.wk>div{min-width:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;min-height:70px}
.wk .dn{font-family:var(--mono);font-weight:500;font-size:13px}
.wk .today{border-color:var(--brand)}
.wk .pm{display:block;background:var(--nova);color:#fff;border-radius:3px;margin-top:3px;padding:1px 3px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .insp{background:var(--warn)}.wk .cb{background:var(--bad)}.wk .job{background:var(--dcmd)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;text-align:center}
.mg .h{color:var(--ink-3);font-size:10px}
.mg .d{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 0 3px;min-height:40px}
.mg .d.x{background:transparent;border-color:transparent}.mg .d.today{border-color:var(--brand)}.mg .d.sel{background:var(--brand-soft);border-color:var(--brand)}
.mg .dots{display:flex;gap:2px;justify-content:center;margin-top:3px}.mg .dots i{width:6px;height:6px;border-radius:50%;background:var(--nova)}.mg .dots i.insp{background:var(--warn)}.mg .dots i.cb{background:var(--bad)}.mg .dots i.job{background:var(--dcmd)}
.defrow{display:grid;grid-template-columns:1fr 70px 28px;gap:6px;margin-bottom:6px}
.fail{background:var(--bad-soft);border:1px solid #F3C9BF;border-radius:8px;padding:10px;margin-top:8px}
.upload{display:block;border:2px dashed var(--line-2);border-radius:10px;padding:16px;text-align:center;color:var(--ink-2);font-size:13px;cursor:pointer}
.upload.has{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
</style></head><body>
<div class="phone">
  <div class="statusbar"><span>10:42</span><span class="row" style="gap:6px"><span class="net" id="net">● Online</span><span>▮▮▮ 🔋</span></span></div>
  <div class="hdr"><img src="assets/rise-logo.png" alt="Rise"><div class="grow"><div style="font-weight:600;line-height:1.1" id="mname">Ron Whitfield</div><div class="xs faint">Mechanic · Richmond · route R-RIC-1</div></div><button class="btn sm" id="togglenet" onclick="toggleNet()">Go offline</button></div>
  <div class="screen" id="screen"></div>
  <div class="tabbar">
    <button class="on" data-t="today" onclick="tab('today')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</button>
    <button data-t="month" onclick="tab('month')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
    <button data-t="lead" onclick="tab('lead')"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>Lead</button>
    <button data-t="time" onclick="tab('time')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Time</button>
  </div>
  <div id="sheet"></div>
</div>
<div class="testmode">Test mode · demo data</div>
<div class="toast" id="toast"></div>
<script src="assets/data.js"></script>
<script>
(function(){
var db=RISE.db,ME='M101',me=RISE.mech(ME),online=true,cur='today',clockedIn=true,jobClock=null,$=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('show')},2600)}
window.toggleNet=function(){online=!online;$('#net').textContent=online?'● Online':'○ Offline';$('#net').classList.toggle('off',!online);$('#togglenet').textContent=online?'Go offline':'Back online';if(online&&db.offlineQueue.length){var n=db.offlineQueue.length;db.offlineQueue.forEach(function(q){RISE.log(me.name,'Mechanic app (synced)',q)});db.offlineQueue=[];RISE.save();toast('Synced '+n+' queued entr'+(n>1?'ies':'y'))}render()};
function queueOrSave(msg){if(online){RISE.log(me.name,'Mechanic app',msg);RISE.save()}else{db.offlineQueue.push(msg);RISE.save();toast('Saved on device — will sync when back online')}}
window.tab=function(t){cur=t;document.querySelectorAll('.tabbar button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});render()};
function myCalls(){return db.calls.filter(function(c){return c.assigned===ME&&c.status!=='complete'})}
function render(){db=RISE.db;var h='';
  if(!online)h+='<div class="offline-note" style="margin-bottom:10px">Offline · everything you enter is kept on this phone'+(db.offlineQueue.length?' · '+db.offlineQueue.length+' waiting to sync':'')+'</div>';
  if(cur==='today'){
    h+='<div class="clockcard"><div class="row between"><div><div class="xs" style="opacity:.7">'+(clockedIn?'On the clock since 6:58a':'Not clocked in')+'</div><div class="t" id="dayclock">3:44:10</div></div><button class="btn big" style="width:auto;background:'+(clockedIn?'#fff':'var(--brand)')+';color:'+(clockedIn?'var(--ink)':'#fff')+';border:0" onclick="clockDay()">'+(clockedIn?'Clock out':'Clock in')+'</button></div><div class="xs" style="opacity:.7;margin-top:8px">Travel today 0:52 · tracked automatically between stops</div></div>';
    var cs=myCalls();
    cs.forEach(function(c){var u=RISE.unit(c.unit),b=RISE.bldg(c.building);h+='<div class="jobcard'+(c.priority==='entrapment'?' ent':'')+'" style="margin-top:12px"><div class="row between"><span class="pill '+(c.priority==='entrapment'?'bad':c.priority==='down'?'warn':'')+'">'+(c.priority==='entrapment'?'ENTRAPMENT':c.priority==='down'?'Unit down':'Callback')+'</span><span class="xs num faint">'+RISE.fmtTime(c.received)+'</span></div><div style="font-weight:600;margin:4px 0">'+esc(b.name)+' · '+esc(u.name)+'</div><div class="small muted">'+esc(c.summary)+'</div><div class="xs faint">'+esc(b.address)+', '+esc(b.city)+' · '+u.make+' '+u.model+'</div>'+(c.ack?'<div class="row" style="margin-top:10px"><span class="pill ok">Acked · ETA '+c.eta+'</span><button class="btn sm" onclick="openJob(\''+c.id+'\',\'call\')">On site → tasks</button></div>':'<div class="row" style="margin-top:10px"><button class="btn primary big" style="flex:1" onclick="ack(\''+c.id+'\')">Got it · ETA 10 min</button><button class="btn big" style="width:auto" onclick="ackCustom(\''+c.id+'\')">Other ETA</button></div>')+'</div>'});
    var vs=db.visits.filter(function(v){return v.mechanic===ME&&v.date===RISE.today});
    var fallback=db.visits.filter(function(v){return v.mechanic===ME&&v.status==='scheduled'}).slice(0,3);
    h+='<h3 style="margin:16px 0 8px">Route today</h3>'+(vs.length?vs:fallback).map(function(v){var u=RISE.unit(v.unit),b=RISE.bldg(v.building);return '<div class="jobcard" onclick="openJob(\''+v.id+'\',\'pm\')"><div class="row between"><b>'+esc(b.name)+' · '+esc(u.name)+'</b><span class="pill '+(v.status==='complete'?'ok':'')+'">'+(v.status==='complete'?'Done':v.estHours+' h')+'</span></div><div class="xs faint">'+esc(v.kind)+' · '+esc(b.city)+' · '+u.make+' '+u.model+'</div></div>'}).join('');
  }
  if(cur==='month'){h+=schedule()}
  if(cur==='lead'){h+='<h3 style="margin-bottom:4px">Send a sales lead</h3><p class="hint" style="margin-bottom:12px">Saw something worth quoting? One photo and a sentence. Sales gets it, and you get credit when it sells.</p><div class="pv"><select id="ld-unit">'+db.units.filter(function(u){return u.territory===me.territory}).map(function(u){return '<option value="'+u.id+'">'+esc(RISE.unitLabel(u.id))+'</option>'}).join('')+'</select><div class="photo" onclick="toast(\'Camera opens here — photo attaches to the lead\')">📷 Tap to add photo (optional)</div><textarea id="ld-note" rows="3" placeholder="e.g. Door operator obsolete, parts no longer available"></textarea><div class="row"><label class="chip"><input type="radio" name="lk" value="Repair" checked> Repair</label><label class="chip"><input type="radio" name="lk" value="Modernization"> Mod</label><label class="chip"><input type="radio" name="lk" value="Safety"> Safety</label></div><button class="btn primary big" onclick="sendLead()">Send to sales</button></div>';
    h+='<h3 style="margin:18px 0 8px">Your leads</h3>'+db.fieldLeads.filter(function(f){return f.mechanic===ME}).map(function(f){return '<div class="jobcard"><div class="row between"><span class="small">'+esc(RISE.unitLabel(f.unit))+'</span><span class="pill '+(f.status==='Sold'?'ok':f.status==='Proposed'?'info':'warn')+'">'+f.status+(f.value?' · '+RISE.money(f.value):'')+'</span></div><div class="xs muted">'+esc(f.note)+'</div></div>'}).join('');
  }
  if(cur==='time'){var t=db.timeEntries.filter(function(x){return x.mechanic===ME}).sort(function(a,b){return a.date<b.date?1:-1}).slice(0,7);var zp=t.reduce(function(s,x){return s+(x.zone?x.zone.zonePay:0)},0),pd=t.reduce(function(s,x){return s+(x.zone?x.zone.perDiem:0)},0);
    var ex=db.expenses.filter(function(e){return e.mechanic===ME});var reimb=ex.filter(function(e){return e.paidWith!=='Company card'&&e.status!=='Paid'}).reduce(function(s,e){return s+e.amount},0);
    h+='<div class="seg"><button class="'+(tv==='hours'?'on':'')+'" onclick="tv=\'hours\';render()">Hours</button><button class="'+(tv==='exp'?'on':'')+'" onclick="tv=\'exp\';render()">Expenses &amp; mileage</button></div>';
    if(tv==='hours'){h+='<div class="jobcard"><b>This week</b><div class="grid g3" style="margin-top:8px"><div class="stat"><span class="v" style="font-size:18px">'+t.reduce(function(s,x){return s+x.work},0).toFixed(1)+'</span><span class="l">work hrs</span></div><div class="stat"><span class="v" style="font-size:18px">'+t.reduce(function(s,x){return s+x.travel},0).toFixed(1)+'</span><span class="l">travel</span></div><div class="stat"><span class="v" style="font-size:18px">'+t.reduce(function(s,x){return s+x.ot},0).toFixed(1)+'</span><span class="l">OT</span></div></div>'+(zp||pd?'<div class="small" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">Zone pay <b class="num">'+RISE.money(zp,1)+'</b> · per diem <b class="num">'+RISE.money(pd)+'</b> <span class="faint">— added automatically from the job address</span></div>':'')+'</div>';
      h+=t.map(function(x){var z=x.zone||{};return '<div class="jobcard"><div class="row between"><span class="num small">'+RISE.fmtDate(x.date,{weekday:'short',month:'short',day:'numeric'})+'</span><span class="num small">'+x.work+'h + '+x.travel+'h travel'+(x.ot?' + '+x.ot+' OT':'')+'</span></div><div class="xs faint">'+esc(x.kind)+(x.job?' · '+x.job:'')+(x.territory!==x.homeTerritory?' · <span style="color:var(--warn)">worked in '+RISE.terr(x.territory).name+'</span>':'')+'</div>'+(z.zonePay||z.perDiem?'<div class="xs" style="margin-top:4px;color:var(--info)">'+z.miles+' mi from hall · zone pay '+RISE.money(z.zonePay,1)+(z.perDiem?' · per diem '+RISE.money(z.perDiem):'')+'</div>':'')+'</div>'}).join('');
      h+='<p class="hint" style="margin-top:8px">Hours go to payroll (ADP) and to each job\'s cost. Zone pay and per diem follow your local\'s rules ('+RISE.find('locals',me.local).zoneMiles+' mi / '+RISE.find('locals',me.local).perDiemMiles+' mi from the hall). Nothing blocks clock-out.</p>'}
    else{h+='<div class="jobcard"><div class="row between"><b>Owed to you</b><span class="num" style="font-size:18px">'+RISE.money(reimb,1)+'</span></div><div class="xs muted">Approved reimbursements go on your next ADP check as a non-taxed line. Company-card receipts just need a photo and a job.</div></div>';
      h+='<div class="pv" style="margin:10px 0"><button class="btn primary big" onclick="expSheet(\'Receipt\')">📷 Add receipt</button><div class="row" style="gap:8px"><button class="btn big" style="flex:1" onclick="expSheet(\'Mileage\')">Mileage</button><button class="btn big" style="flex:1" onclick="expSheet(\'Hauling\')">Hauling / trailer</button></div></div>';
      h+=ex.sort(function(a,b){return a.date<b.date?1:-1}).map(function(e){return '<div class="jobcard"><div class="row between"><span class="small"><b>'+e.kind+'</b> · '+esc(e.desc)+'</span><span class="num">'+RISE.money(e.amount,1)+'</span></div><div class="xs faint">'+RISE.fmtDate(e.date)+(e.vendor?' · '+esc(e.vendor):'')+(e.miles?' · '+e.miles+' mi @ $'+e.rate:'')+' · charged to <b>'+e.chargeTo+'</b> · '+e.paidWith+'</div><div style="margin-top:4px"><span class="pill '+(e.status==='Approved'||e.status==='Matched to PO'||e.status==='Paid'?'ok':e.status.indexOf('Needs')===0?'warn':'')+'">'+e.status+'</span></div></div>'}).join('')}
  }
  $('#screen').innerHTML=h;wireICS();
}
window.clockDay=function(){clockedIn=!clockedIn;queueOrSave(clockedIn?'Clocked in for the day':'Clocked out for the day');render();toast(clockedIn?'Clocked in':'Clocked out · 8.2 h to payroll')};
window.ack=function(id,eta){var c=RISE.find('calls',id);c.ack=RISE.nowStamp();c.eta=eta||'10:52';c.status='en route';queueOrSave('Acknowledged '+id+' · ETA '+c.eta+' · customer texted');render();toast('Office + customer notified · ETA '+c.eta)};
window.ackCustom=function(id){$('#sheet').innerHTML='<div class="sheet"><div class="hdr"><button class="btn sm" onclick="closeSheet()">‹ Back</button><b>Your ETA</b></div><div class="screen"><div class="pv">'+['15 min','30 min','45 min','1 hour','Can\'t take it — send backup'].map(function(e){return '<button class="btn big" onclick="'+(e[0]==='C'?'bounce(\''+id+'\')':'ack(\''+id+'\',\''+e+'\');closeSheet()')+'">'+e+'</button>'}).join('')+'</div></div></div>'};
window.bounce=function(id){var c=RISE.find('calls',id);c.assigned='M103';c.assignReason='Declined by Ron — backup';c.status='awaiting ack';queueOrSave('Declined '+id+' — rerouted to Luis Ortega, office alerted');closeSheet();render();toast('Sent to Luis · office alerted')};
window.closeSheet=function(){$('#sheet').innerHTML=''};
window.openJob=function(id,kind){var v=kind==='pm'?RISE.find('visits',id):RISE.find('calls',id);var u=RISE.unit(v.unit),b=RISE.bldg(v.building);var tasks=kind==='pm'?v.tasks:['Free entrapped passengers (if any) & confirm safe','Identify fault · pull controller log','Correct & test run 3 cycles','Verify door operation & leveling','Return to service · photo of car in service'];
  var done=v._done||{};
  var h='<div class="sheet"><div class="hdr"><button class="btn sm" onclick="closeSheet()">‹ Back</button><div class="grow"><b>'+esc(b.name)+' · '+esc(u.name)+'</b><div class="xs faint">'+u.make+' '+u.model+' · '+u.type+' · '+u.year+' · state ID '+u.stateId+'</div></div></div><div class="screen">';
  h+='<div class="row" style="margin-bottom:12px"><button class="btn '+(jobClock===id?'dark':'primary')+' big" style="flex:1" onclick="jobClockToggle(\''+id+'\')">'+(jobClock===id?'■ Stop job clock · 0:38':'▶ Start job clock')+'</button><button class="btn big" style="width:auto" onclick="toast(\'MCP log opened — last 12 months of entries for this unit\')">MCP</button></div>';
  if(u.callbacks90>=3)h+='<div class="offline-note" style="margin-bottom:10px;background:var(--bad-soft);color:var(--bad)">Callback Watch · '+u.callbacks90+' callbacks in 90 days on this unit. Note root cause on close-out.</div>';
  var ins=db.inspections.filter(function(x){return x.unit===v.unit&&x.mechanic===ME&&x.status!=='Completed'})[0];
  if(ins)h+='<div class="jobcard" style="border-color:var(--warn);background:var(--warn-soft)"><div class="row between"><b>'+esc(ins.test)+' · '+esc(RISE.ahj(ins.ahj).name)+'</b><span class="pill warn">'+(ins.confirmed?RISE.fmtDate(ins.confirmed)+' '+ins.confirmed.slice(11):ins.status)+'</span></div><div class="xs muted" style="margin:4px 0 8px">Meet the inspector on site. When the test is done, file the report and anything they noted.</div><button class="btn primary big" onclick="testCloseout(\''+ins.id+'\')">Record test result</button></div>';
  h+='<h3>'+(kind==='pm'?v.kind:'Callback')+' tasks</h3><p class="hint" style="margin-bottom:4px">Tap a task for the steps and code reference.</p>'+tasks.map(function(t,i){return '<div class="task'+(done[i]?' done':'')+'"><input type="checkbox" '+(done[i]?'checked':'')+' onchange="tick(\''+id+'\',\''+kind+'\','+i+',this.checked)"><span class="ttl" onclick="taskInfo(\''+esc(t).replace(/'/g,"\\'")+'\',\''+id+'\',\''+kind+'\','+i+')">'+esc(t)+'</span><span class="more" onclick="taskInfo(\''+esc(t).replace(/'/g,"\\'")+'\',\''+id+'\',\''+kind+'\','+i+')">Details ›</span></div>'}).join('');
  if(kind==='pm'&&u.type.indexOf('Hydraulic')===0)h+='<div class="field" style="margin-top:12px"><label>Hydraulic oil added (qt)</label><input value="0" inputmode="decimal"></div>';
  h+='<div class="field" style="margin-top:12px"><label>Notes</label><textarea rows="2" placeholder="What you found, what you did"></textarea></div><div class="row" style="margin-top:10px"><div class="photo grow" onclick="toast(\'Photo attached to this visit\')">📷 Add photo</div><div class="photo grow" onclick="toast(\'PlateScan read: '+u.make+' · '+u.model+' · cap '+u.capacity+' lb\')">🔍 PlateScan data plate</div></div>';
  h+='<div class="pv" style="margin-top:14px"><button class="btn primary big" onclick="closeOut(\''+id+'\',\''+kind+'\')">Close out · '+(kind==='pm'?'update MCP log':'unit back in service')+'</button><button class="btn big" onclick="repairReq(\''+id+'\')">Create repair request for office</button><button class="btn big" onclick="tab(\'lead\');closeSheet()">Send sales lead from this unit</button></div></div></div>';
  $('#sheet').innerHTML=h;
};
window.tick=function(id,kind,i,v){var o=kind==='pm'?RISE.find('visits',id):RISE.find('calls',id);o._done=o._done||{};o._done[i]=v;RISE.save()};
window.jobClockToggle=function(id){jobClock=jobClock===id?null:id;queueOrSave((jobClock?'Started':'Stopped')+' job clock on '+id);openJob(id,id[0]==='P'?'pm':'call')};

function myItems(dd){var out=[];db.visits.forEach(function(v){if(v.mechanic===ME&&v.date===dd)out.push({k:'pm',t:RISE.bldg(v.building).name+' · '+RISE.unit(v.unit).name+' · '+v.estHours+'h',id:v.id,kind:'pm',time:'08:00',dur:v.estHours})});
  db.inspections.forEach(function(i){if(i.mechanic===ME&&i.confirmed&&i.confirmed.slice(0,10)===dd)out.push({k:'insp',t:i.test+' with '+RISE.ahj(i.ahj).name+' · '+RISE.unitLabel(i.unit),id:i.id,kind:'insp',time:i.confirmed.slice(11),dur:2})});
  db.calls.forEach(function(c){if(c.assigned===ME&&c.received.slice(0,10)===dd)out.push({k:'cb',t:(c.priority==='entrapment'?'ENTRAPMENT':'Callback')+' · '+RISE.unitLabel(c.unit),id:c.id,kind:'call',time:c.received.slice(11),dur:2})});
  db.jobs.forEach(function(j){if(j.crew.indexOf(ME)>-1&&dd>=j.start&&dd<=j.end&&new Date(dd+'T12:00').getDay()%6)out.push({k:'job',t:j.id+' · '+j.name,id:j.id,kind:'job',time:'07:00',dur:8})});return out}
window.schMode=function(m){sch.mode=m;render()};window.schNav=function(n){sch.m+=n;if(sch.m>11){sch.m=0;sch.y++}if(sch.m<0){sch.m=11;sch.y--}sch.sel=null;render()};window.schSel=function(d){sch.sel=sch.sel===d?null:d;render()};
function schedule(){var h='<div class="seg"><button class="'+(sch.mode==='week'?'on':'')+'" onclick="schMode(\'week\')">Week</button><button class="'+(sch.mode==='month'?'on':'')+'" onclick="schMode(\'month\')">Month</button><button class="'+(sch.mode==='list'?'on':'')+'" onclick="schMode(\'list\')">Due list</button></div>';
  if(sch.mode==='week'){var mon=RISE.addDays(RISE.today,-((new Date(RISE.today+'T12:00').getDay()+6)%7));h+='<div class="wk">';for(var i=0;i<5;i++){var dd=RISE.addDays(mon,i);var it=myItems(dd);h+='<div class="'+(dd===RISE.today?'today':'')+'"><div class="xs faint">'+RISE.fmtDate(dd,{weekday:'short'})+'</div><div class="dn">'+(+dd.slice(8))+'</div>'+it.map(function(x){return '<span class="pm '+x.k+'" onclick="openItem(\''+x.kind+'\',\''+x.id+'\')">'+esc(x.t.split(' · ')[0])+'</span>'}).join('')+'</div>'}h+='</div>';
    var wkItems=[];for(var i=0;i<5;i++){var dd=RISE.addDays(mon,i);myItems(dd).forEach(function(x){x.d=dd;wkItems.push(x)})}
    h+='<div class="jobcard"><div class="row between"><b>This week</b><span class="num small">'+wkItems.reduce(function(a,x){return a+x.dur},0).toFixed(1)+' h planned</span></div></div>'+wkItems.map(function(x){return '<div class="jobcard" onclick="openItem(\''+x.kind+'\',\''+x.id+'\')"><div class="row between"><span class="num small">'+RISE.fmtDate(x.d,{weekday:'short',month:'short',day:'numeric'})+' · '+x.time+'</span><span class="pill '+(x.k==='cb'?'bad':x.k==='insp'?'warn':x.k==='job'?'info':'')+'">'+(x.k==='pm'?'PM':x.k==='cb'?'Callback':x.k==='insp'?'Test':'Job')+'</span></div><div class="small">'+esc(x.t)+'</div></div>'}).join('')}
  if(sch.mode==='month'){var first=new Date(sch.y,sch.m,1),dim=new Date(sch.y,sch.m+1,0).getDate(),pad=first.getDay();h+='<div class="row between" style="margin-bottom:8px"><button class="btn sm" onclick="schNav(-1)">‹</button><b>'+first.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</b><button class="btn sm" onclick="schNav(1)">›</button></div><div class="mg">'+['S','M','T','W','T','F','S'].map(function(x){return '<div class="h">'+x+'</div>'}).join('');for(var i=0;i<pad;i++)h+='<div class="d x"></div>';for(var dn=1;dn<=dim;dn++){var dd=sch.y+'-'+(sch.m<9?'0':'')+(sch.m+1)+'-'+(dn<10?'0':'')+dn;var it=myItems(dd);var ks={};it.forEach(function(x){ks[x.k]=1});h+='<div class="d'+(dd===RISE.today?' today':'')+(sch.sel===dd?' sel':'')+'" onclick="schSel(\''+dd+'\')">'+dn+'<div class="dots">'+Object.keys(ks).map(function(k){return '<i class="'+k+'"></i>'}).join('')+'</div></div>'}h+='</div>';
    if(sch.sel){var it=myItems(sch.sel);h+='<div class="jobcard" style="margin-top:10px"><b>'+RISE.fmtDate(sch.sel,{weekday:'long',month:'long',day:'numeric'})+'</b>'+(it.length?it.map(function(x){return '<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="openItem(\''+x.kind+'\',\''+x.id+'\')">'+x.time+' · '+esc(x.t)+'</div>'}).join(''):'<div class="hint" style="margin-top:6px">Nothing scheduled</div>')+'</div>'}}
  if(sch.mode==='list'){var vs=db.visits.filter(function(v){return v.mechanic===ME&&v.date.slice(0,7)==='2026-11'});var done=vs.filter(function(v){return v.status==='complete'}).length;
    h+='<div class="jobcard"><div class="row between"><b>November</b><span class="num">'+done+' / '+vs.length+'</span></div><div class="bar" style="margin-top:8px"><i class="ok" style="width:'+(done/vs.length*100)+'%"></i></div><div class="xs faint" style="margin-top:6px">'+vs.reduce(function(s,v){return s+v.estHours},0).toFixed(1)+' route hours · '+db.inspections.filter(function(i){return i.mechanic===ME&&i.status!=='Completed'}).length+' tests with an AHJ</div></div>';
    h+=vs.sort(function(a,b){return a.date<b.date?-1:1}).map(function(v){var u=RISE.unit(v.unit),b=RISE.bldg(v.building);var ins=db.inspections.filter(function(i){return i.unit===v.unit&&i.mechanic===ME})[0];return '<div class="jobcard" onclick="openJob(\''+v.id+'\',\'pm\')"><div class="row between"><span class="num small">'+RISE.fmtDate(v.date,{weekday:'short',month:'short',day:'numeric'})+'</span><span class="pill '+(v.status==='complete'?'ok':v.status==='in progress'?'info':'')+'">'+v.status+'</span></div><b>'+esc(b.name)+' · '+esc(u.name)+'</b><div class="xs faint">'+esc(v.kind)+' · '+v.estHours+' h'+(ins?' · <span style="color:var(--warn)">'+ins.test+' with '+esc(RISE.ahj(ins.ahj).name)+' '+(ins.confirmed?RISE.fmtDate(ins.confirmed):'(unbooked)')+'</span>':'')+'</div></div>'}).join('')}
  h+='<div class="jobcard" style="margin-top:12px"><b>Your phone calendar</b><div class="xs muted" style="margin:4px 0 10px">Route visits, tests and jobs as calendar events. Subscribe once and it stays in sync as dispatch changes things.</div><div class="row"><a class="btn" id="ics" href="#" download="rise-'+ME+'-schedule.ics">Add to calendar (.ics)</a><button class="btn" onclick="toast(\'Subscription link copied: webcal://riseos.example/cal/'+ME+'.ics — paste into iPhone Calendar or Google Calendar\')">Subscribe (auto-sync)</button></div></div>';
  return h}

function buildICS(){var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RiseOS//Mechanic//EN','X-WR-CALNAME:Rise · '+me.name];var dd='2026-11-01';for(var i=0;i<92;i++){var day=RISE.addDays(dd,i);myItems(day).forEach(function(x){var st=day.replace(/-/g,'')+'T'+x.time.replace(':','')+'00';var eh=(+x.time.slice(0,2))+Math.ceil(x.dur);var en=day.replace(/-/g,'')+'T'+(eh<10?'0':'')+eh+x.time.slice(3)+'00';lines.push('BEGIN:VEVENT','UID:'+x.id+'-'+day+'@riseos','DTSTART:'+st,'DTEND:'+en,'SUMMARY:'+x.t.replace(/,/g,'\\,'),'END:VEVENT')})}lines.push('END:VCALENDAR');return lines.join('\r\n')}

/* ---------- inspection / test close-out ---------- */
window.defs=[];
window.testCloseout=function(id){var ins=RISE.find('inspections',id);var u=RISE.unit(ins.unit),b=RISE.bldg(ins.building),a=RISE.ahj(ins.ahj);defs=defs.length?defs:[{item:'',days:30}];
  $('#sheet').innerHTML='<div class="sheet"><div class="hdr"><button class="btn sm" onclick="closeSheet()">‹ Back</button><div class="grow"><b>'+esc(ins.test)+'</b><div class="xs faint">'+esc(b.name)+' · '+esc(u.name)+' · '+esc(a.name)+(ins.confirmed?' · '+RISE.fmtDate(ins.confirmed)+' '+ins.confirmed.slice(11):'')+'</div></div></div><div class="screen">'
  +'<div class="jobcard"><b>Inspection report</b><div class="xs muted" style="margin:2px 0 8px">Photograph every page the inspector signs. It files to the unit and the customer portal.</div><label class="upload" id="up"><input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="upDone(this)">📷 Take photos of the report</label></div>'
  +'<div class="jobcard"><div class="field"><label>Inspector</label><input id="tc-insp" value="'+esc(a.contact)+'"></div><div class="field" style="margin-top:8px"><label>Result</label><div class="seg" style="margin:0"><button class="on" id="r-pass" onclick="tcRes(\'pass\')">Pass</button><button id="r-def" onclick="tcRes(\'def\')">Pass w/ deficiencies</button><button id="r-fail" onclick="tcRes(\'fail\')">Fail</button></div></div></div>'
  +'<div class="jobcard hide" id="defbox"><b>Deficiencies the inspector noted</b><div class="xs muted" style="margin:2px 0 8px">Each one becomes a FixFlow finding with its correction deadline, and the office drafts the repair quote.</div><div id="defrows"></div><button class="btn sm" onclick="defs.push({item:\'\',days:30});drawDefs()">+ Add deficiency</button></div>'
  +'<button class="btn primary big" style="margin-top:4px" onclick="tcSubmit(\''+id+'\')">Submit test record</button></div></div>';drawDefs()};
window.upDone=function(i){var n=i.files.length;var l=document.getElementById('up');l.classList.add('has');l.textContent='✓ '+n+' photo'+(n>1?'s':'')+' attached — uploads when online'};
window.tcRes=function(r){['pass','def','fail'].forEach(function(k){document.getElementById('r-'+k).classList.toggle('on',k===r)});document.getElementById('defbox').classList.toggle('hide',r==='pass');window._tcRes=r};
function drawDefs(){var el=document.getElementById('defrows');if(!el)return;el.innerHTML=defs.map(function(d,i){return '<div class="defrow"><input placeholder="e.g. Pit light inoperative" value="'+esc(d.item)+'" onchange="defs['+i+'].item=this.value"><select onchange="defs['+i+'].days=+this.value">'+[7,14,30,60,90].map(function(n){return '<option value="'+n+'"'+(n===d.days?' selected':'')+'>'+n+' d</option>'}).join('')+'</select><button class="btn sm ghost" onclick="defs.splice('+i+',1);drawDefs()">✕</button></div>'}).join('')}
window.tcSubmit=function(id){var ins=RISE.find('inspections',id);var r=window._tcRes||'pass';var ds=defs.filter(function(d){return d.item});ins.status='Completed';ins.result=r==='pass'?'Pass':r==='def'?'Pass with deficiencies':'Fail';ins.reportPhotos=true;
  var u=RISE.unit(ins.unit);if(r!=='fail'){u.cat1Due=RISE.addDays(RISE.today,365);u.certExpires=RISE.addDays(RISE.today,395)}
  ds.forEach(function(d){db.findings.unshift({id:RISE.nextId('FX-','findings'),unit:ins.unit,building:ins.building,source:ins.test+' — '+RISE.ahj(ins.ahj).name+' '+RISE.fmtDate(RISE.today),kind:r==='fail'?'Citation':'Test deficiency',item:d.item,correctBy:RISE.addDays(RISE.today,d.days),status:'New',proposal:null,amount:null})});
  db.mcp.unshift({unit:ins.unit,date:RISE.today,by:ME,task:ins.test+' with '+RISE.ahj(ins.ahj).name+' ('+$('#tc-insp').value+')',result:ins.result+(ds.length?' — '+ds.length+' item'+(ds.length>1?'s':'')+' to FixFlow':'')});
  queueOrSave(ins.test+' on '+RISE.unitLabel(ins.unit)+': '+ins.result+(ds.length?' · '+ds.length+' deficiencies sent to FixFlow':'')+' · report photos filed');defs=[];closeSheet();render();toast('Test record filed'+(ds.length?' · '+ds.length+' finding'+(ds.length>1?'s':'')+' to office':''))};

window.render=render;
var secs=3*3600+44*60+10;setInterval(function(){secs++;var e=document.getElementById('dayclock');if(e&&clockedIn){var h=Math.floor(secs/3600),m=Math.floor(secs%3600/60),s=secs%60;e.textContent=h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s}},1000);
RISE.onChange(function(){if(!document.querySelector('.sheet'))render()});
render();
})();
</script></body></html>
