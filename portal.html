<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Rise Customer Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/ui.css">
<style>
.bar{height:auto;background:none;border-radius:0}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar img{height:30px}
.wrap{max-width:1080px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.unitrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.hist li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist{list-style:none;margin:0;padding:0}
.hold{background:var(--warn-soft);border:1px solid #EBD3A4;border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.tabs button{font-size:14px}
.sev{display:grid;gap:8px}
.sev label{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line-2);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.sev label.on{border-color:var(--brand);background:var(--brand-soft)}
.sev input{width:18px;height:18px;margin:2px 0 0;flex:none}
.sev b{display:block}.sev span{font-size:12.5px;color:var(--ink-2)}
.sev label.ent{border-color:#F3C9BF}.sev label.ent b{color:var(--bad)}
</style></head><body>
<div class="topbar"><img src="assets/rise-logo.png" alt="Rise Elevator"><div><div style="font-weight:600">Customer portal</div><div class="xs faint" id="who"></div></div><div class="grow"></div><select id="cust" style="max-width:300px;font-size:13px;padding:6px 8px"></select><a href="index.html" class="small">Demo home</a></div>
<div class="wrap">
  <div id="hold"></div>
  <div class="grid g4" id="stats" style="margin-bottom:16px"></div>
  <div class="tabs"><button class="on" onclick="t(this,0)">My buildings & units</button><button onclick="t(this,1)">Request service</button><button onclick="t(this,2)">Proposals & approvals</button><button onclick="t(this,3)">Invoices & payments</button><button onclick="t(this,4)">Compliance documents</button></div>
  <div class="pt" id="p0"></div><div class="pt" id="p1" hidden></div><div class="pt" id="p2" hidden></div><div class="pt" id="p3" hidden></div><div class="pt" id="p4" hidden></div>
</div>
<div class="testmode">Test mode · demo data</div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<script src="assets/data.js"></script>
<script>
(function(){
var db=RISE.db,$=function(s){return document.querySelector(s)},money=RISE.money,fd=RISE.fmtDate;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function toast(m){var x=$('#toast');x.textContent=m;x.classList.add('show');clearTimeout(x._x);x._x=setTimeout(function(){x.classList.remove('show')},2600)}
var cid=(location.search.match(/c=(C\d+)/)||[])[1]||'C06';
window.t=function(b,i){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.querySelectorAll('.pt').forEach(function(x,j){x.hidden=j!==i})};
function render(){db=RISE.db;var c=RISE.cust(cid);var bs=db.buildings.filter(function(b){return b.customer===cid});var us=db.units.filter(function(u){return u.customer===cid});var con=db.contracts.filter(function(x){return x.customer===cid})[0];
  $('#cust').innerHTML=db.customers.map(function(x){return '<option value="'+x.id+'"'+(x.id===cid?' selected':'')+'>'+esc(x.name)+'</option>'}).join('');$('#cust').onchange=function(){cid=this.value;render()};
  $('#who').textContent=c.name+' · signed in as '+c.contact+' · '+(c.kind==='Portfolio'?bs.length+' buildings':'1 building');
  $('#hold').innerHTML=c.creditHold&&!c.holdOverride?'<div class="hold"><b>Account past due '+c.daysPastDue+' days.</b> Maintenance visits and new repairs are paused until the balance of '+money(c.balance)+' is settled. <button class="btn sm primary" onclick="payNow()">Pay now</button> <span class="small muted">or call (804) 624-7327 to arrange terms.</span></div>':'';
  var down=us.filter(function(u){return u.status!=='running'}).length;var open=db.calls.filter(function(x){return us.some(function(u){return u.id===x.unit})&&x.status!=='complete'});var nextPM=db.visits.filter(function(v){return us.some(function(u){return u.id===v.unit})&&v.status==='scheduled'}).sort(function(a,b){return a.date<b.date?-1:1})[0];
  $('#stats').innerHTML='<div class="card stat"><span class="v">'+(us.length-down)+' / '+us.length+'</span><span class="l">Units in service</span></div><div class="card stat"><span class="v">'+open.length+'</span><span class="l">Open service requests</span></div><div class="card stat"><span class="v">'+(nextPM?fd(nextPM.date):'—')+'</span><span class="l">Next maintenance visit'+(nextPM?' · '+esc(RISE.bldg(nextPM.building).name):'')+'</span></div><div class="card stat"><span class="v">'+money(c.balance)+'</span><span class="l">Open balance · '+(con?con.type+' agreement':'no agreement')+'</span></div>';
  // p0 units
  $('#p0').innerHTML=bs.map(function(b){var bu=us.filter(function(u){return u.building===b.id});return '<div class="card" style="margin-bottom:12px"><div class="row between"><div><h3>'+esc(b.name)+'</h3><div class="xs faint">'+esc(b.address)+', '+esc(b.city)+' · inspections by '+esc(RISE.ahj(b.ahj).name)+'</div></div><span class="pill">'+bu.length+' unit'+(bu.length>1?'s':'')+'</span></div>'+bu.map(function(u){var cn=RISE.daysBetween(RISE.today,u.certExpires);var oc=open.filter(function(x){return x.unit===u.id})[0];return '<div class="unitrow"><div><b>'+esc(u.name)+'</b> <span class="faint small">· '+u.make+' '+u.model+' · '+u.type+' · state ID '+u.stateId+'</span><div class="xs muted" style="margin-top:3px">Cat 1 test due '+fd(u.cat1Due,{month:'short',day:'numeric',year:'numeric'})+' · certificate '+(cn<0?'<span style="color:var(--bad)">expired</span>':'valid to '+fd(u.certExpires,{month:'short',day:'numeric',year:'numeric'}))+(oc?' · <span style="color:var(--info)">'+(oc.ack?'Mechanic '+RISE.mech(oc.assigned).name.split(' ')[0]+' en route, ETA '+oc.eta:'Request received '+RISE.fmtTime(oc.received))+'</span>':'')+'</div></div><div class="row">'+(u.status==='down'?'<span class="pill bad">Out of service</span>':u.status==='restricted'?'<span class="pill warn">Restricted</span>':'<span class="pill ok">In service</span>')+'<button class="btn sm" onclick="history(\''+u.id+'\')">History</button></div></div>'}).join('')+'</div>'}).join('');
  // p1 request
  $('#p1').innerHTML='<div class="grid g2"><div class="card"><h3>Report a problem</h3><p class="hint" style="margin-bottom:12px">Goes straight to dispatch and to your route mechanic\'s phone. You\'ll get a text when they acknowledge, with an ETA.</p><div class="stack"><div class="field"><label>Unit</label><select id="rq-unit">'+us.map(function(u){return '<option value="'+u.id+'">'+esc(RISE.unitLabel(u.id))+'</option>'}).join('')+'</select></div><div class="field"><label>What\'s happening</label><input id="rq-sum" placeholder="e.g. Car stopped at 3, doors open, nobody inside"></div><div class="field"><label>How urgent</label><div class="sev"><label class="on"><input type="radio" name="rp" value="routine" checked onchange="sevPick(this)"><div><b>Running, but something\'s off</b><span>Noisy, slow, mis-leveling, a light out</span></div></label><label><input type="radio" name="rp" value="down" onchange="sevPick(this)"><div><b>Out of service</b><span>Car won\'t move or doors won\'t close</span></div></label><label class="ent"><input type="radio" name="rp" value="entrapment" onchange="sevPick(this)"><div><b>Someone is trapped</b><span>Dispatched immediately. Please also call (804) 624-7327.</span></div></label></div></div><div class="grid g2"><div class="field"><label>Your name</label><input id="rq-name" value="'+esc(c.contact)+'"></div><div class="field"><label>Mobile for text updates</label><input id="rq-phone" value="(804) 555-0199"></div></div><button class="btn primary" style="align-self:flex-start" onclick="sendReq()">Send request</button></div></div><div class="card"><h3>Your requests</h3>'+db.calls.filter(function(x){return us.some(function(u){return u.id===x.unit})}).map(function(x){return '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row between"><b class="small">'+esc(RISE.unitLabel(x.unit))+'</b><span class="pill '+(x.status==='complete'?'ok':x.ack?'info':'warn')+'">'+(x.status==='complete'?'Resolved':x.ack?'Mechanic en route · ETA '+x.eta:'Received')+'</span></div><div class="xs muted">'+esc(x.summary)+' · '+fd(x.received)+' '+RISE.fmtTime(x.received)+' via '+esc(x.source)+'</div></div>'}).join('')+'</div></div>';
  // p2 proposals
  var ps=db.proposals.filter(function(p){return p.customer===cid&&p.status!=='Draft'&&p.status!=='Pending ops approval'});var fs=db.findings.filter(function(f){return us.some(function(u){return u.id===f.unit})});
  $('#p2').innerHTML='<div class="grid g2"><div class="card"><h3>Proposals</h3>'+(ps.length?ps.map(function(p){return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row between"><b>'+esc(p.title)+'</b><span class="num">'+money(p.amount)+(p.monthly?'/mo':'')+'</span></div><div class="xs muted">'+p.id+' · '+esc(RISE.bldg(p.building).name)+' · '+p.type+' · '+(p.status==='Signed'?'<span class="pill ok">Signed '+fd(p.signed)+'</span>':'<span class="pill info">'+p.status+'</span>')+'</div>'+(p.status!=='Signed'?'<a class="btn sm primary" style="margin-top:8px" href="proposal.html?id='+p.id+'">Review &amp; sign</a>':'')+'</div>'}).join(''):'<div class="hint">No open proposals.</div>')+'</div><div class="card"><h3>Inspection findings</h3><p class="hint" style="margin-bottom:8px">Citations and deficiencies with the deadline the inspector set. Approve a correction here and it\'s scheduled.</p>'+(fs.length?fs.map(function(f){return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row between"><span class="small"><span class="pill '+(f.kind==='Citation'?'bad':'warn')+'">'+f.kind+'</span> '+esc(f.item)+'</span></div><div class="xs muted">'+esc(RISE.unitLabel(f.unit))+' · correct by '+fd(f.correctBy)+' · '+f.status+(f.amount?' · '+money(f.amount):'')+'</div>'+(f.status==='Awaiting customer'?'<button class="btn sm primary" style="margin-top:6px" onclick="approveFinding(\''+f.id+'\')">Approve '+money(f.amount)+' correction</button>':'')+'</div>'}).join(''):'<div class="hint">No open findings.</div>')+'</div></div>';
  // p3 invoices
  var inv=db.invoices.filter(function(i){return i.customer===cid});
  $('#p3').innerHTML='<div class="card"><div class="row between" style="margin-bottom:8px"><h3>Invoices</h3><div class="row"><span class="small muted">Payment: '+(c.payMethod==='autopay'?'card autopay on file':c.payMethod==='ach'?'ACH':c.payMethod==='card'?'card on file':'check')+'</span><button class="btn sm" onclick="toast(\'Autopay enrolled — maintenance invoices charge on the due date\')">'+(c.payMethod==='autopay'?'Manage autopay':'Set up autopay')+'</button></div></div><div class="tbl"><table><tr><th>Invoice</th><th>For</th><th class="num">Amount</th><th>Due</th><th>Status</th><th></th></tr>'+inv.map(function(i){return '<tr><td class="num">'+i.id+'</td><td>'+i.kind+'<br><span class="xs faint">'+i.ref+'</span></td><td class="num">'+money(i.amount)+'</td><td class="num">'+fd(i.due)+'</td><td><span class="pill '+(i.status==='Paid'?'ok':i.status==='Overdue'?'bad':'')+'">'+i.status+'</span></td><td>'+(i.status!=='Paid'?'<button class="btn sm primary" onclick="payNow(\''+i.id+'\')">Pay</button>':'<button class="btn sm ghost" onclick="toast(\'PDF receipt downloaded\')">Receipt</button>')+'</td></tr>'}).join('')+'</table></div>'+(con?'<p class="hint" style="margin-top:10px">Agreement '+con.id+' · '+con.type+' · '+money(con.monthly)+'/mo billed '+con.billing.toLowerCase()+' · next price adjustment '+fd(con.escalation.next,{month:'short',day:'numeric',year:'numeric'})+' (+'+con.escalation.pct+'%, '+con.escalation.indexed+') · term ends '+fd(con.end,{month:'short',day:'numeric',year:'numeric'})+'</p>':'')+'</div>';
  // p4 docs
  $('#p4').innerHTML='<div class="card"><h3>Documents by unit</h3><p class="hint" style="margin-bottom:10px">Certificates, test reports, inspection reports and the maintenance log. Everything your insurer or AHJ asks for, downloadable.</p><div class="tbl"><table><tr><th>Unit</th><th>Certificate of operation</th><th>Last Cat 1 report</th><th>Maintenance log</th><th>Monthly schedule</th></tr>'+us.map(function(u){var cn=RISE.daysBetween(RISE.today,u.certExpires);return '<tr><td><b>'+esc(RISE.unitLabel(u.id))+'</b><br><span class="xs faint">'+u.stateId+'</span></td><td>'+(cn<0?'<span class="pill bad">Expired · renewal filed</span>':'<a href="#" onclick="toast(\'Certificate PDF\');return false">PDF</a> <span class="xs faint">to '+fd(u.certExpires)+'</span>')+'</td><td><a href="#" onclick="toast(\'Test report PDF\');return false">PDF</a> <span class="xs faint">'+fd(RISE.addDays(u.cat1Due,-365))+'</span></td><td><a href="#" onclick="history(\''+u.id+'\');return false">View log</a></td><td><a href="#" onclick="toast(\'November schedule emailed\');return false">Nov</a></td></tr>'}).join('')+'</table></div></div>';
}
window.history=function(uid){var u=RISE.unit(uid);var logs=db.mcp.filter(function(m){return m.unit===uid});var calls=db.calls.filter(function(c){return c.unit===uid});var vs=db.visits.filter(function(v){return v.unit===uid});var items=[];logs.forEach(function(l){items.push({d:l.date,t:l.task+' — '+l.result,who:RISE.mech(l.by).name})});calls.forEach(function(c){items.push({d:c.received.slice(0,10),t:'Service call: '+c.summary+' ('+c.status+')',who:c.assigned?RISE.mech(c.assigned).name:'—'})});vs.forEach(function(v){items.push({d:v.date,t:v.kind+' · '+v.status,who:RISE.mech(v.mechanic).name})});items.sort(function(a,b){return a.d<b.d?1:-1});
  $('#modal').innerHTML='<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="modal"><div class="row between"><h2>'+esc(RISE.unitLabel(uid))+'</h2><button class="btn sm ghost" onclick="this.closest(\'.modal-bg\').remove()">✕</button></div><div class="small muted" style="margin:4px 0 12px">'+u.make+' '+u.model+' · '+u.type+' · installed '+u.year+' · '+u.stops+' stops · '+u.capacity+' lb</div><ul class="hist">'+items.map(function(i){return '<li><span class="num faint">'+fd(i.d)+'</span><span>'+esc(i.t)+'<br><span class="xs faint">'+esc(i.who)+'</span></span></li>'}).join('')+'</ul><button class="btn" style="margin-top:12px" onclick="toast(\'History exported as PDF\')">Export PDF</button></div></div>'};
window.sevPick=function(i){document.querySelectorAll('.sev label').forEach(function(l){l.classList.toggle('on',l.querySelector('input').checked)})};
window.sendReq=function(){var p=document.querySelector('input[name=rp]:checked').value;var c=RISE.cust(cid);var r=RISE.createRequest({unit:$('#rq-unit').value,name:c.contact,contact:$('#rq-phone').value,source:'Customer portal',summary:$('#rq-sum').value||'Problem reported',priority:p});toast(r.assigned?'Sent · '+RISE.mech(r.assigned).name+' has been texted':'Sent to dispatch');render();document.querySelectorAll('.tabs button')[1].click()};
window.approveFinding=function(id){var f=RISE.find('findings',id);f.status='Customer approved';RISE.log(RISE.cust(cid).contact,'Customer portal','Approved correction '+id+' · '+money(f.amount)+' · scheduling with route mechanic');RISE.save();render();toast('Approved — we\'ll schedule and book the re-inspection')};
window.payNow=function(id){var c=RISE.cust(cid);var inv=db.invoices.filter(function(i){return i.customer===cid&&i.status!=='Paid'&&(!id||i.id===id)});inv.forEach(function(i){i.status='Paid'});c.balance=db.invoices.filter(function(i){return i.customer===cid&&i.status!=='Paid'}).reduce(function(s,i){return s+i.amount},0);if(!c.balance){c.creditHold=false;c.daysPastDue=0}RISE.log(c.contact,'Customer portal','Paid '+inv.map(function(i){return i.id}).join(', ')+' by card (Stax)'+(c.creditHold?'':' · credit hold cleared automatically'));RISE.save();render();toast('Paid · receipt emailed · QuickBooks updated')};
RISE.onChange(render);render();
})();
</script></body></html>
